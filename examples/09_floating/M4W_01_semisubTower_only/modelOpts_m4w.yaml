# Generic modeling options file to run standard WISDEM case
General:
    verbosity: False  # When set to True, the code prints to screen many infos
WISDEM:
    RotorSE:
        flag: False
    DriveSE:
        flag: False
    TowerSE:             # Options of TowerSE module
        flag: True
        wind: PowerWind
        gamma_f: 1.2    # Safety factor for loads
        gamma_m: 1.3     # Safety factor for material properties
        gamma_n: 1.0     # Safety factor for consequence of failure
        gamma_b: 1.1     # Safety factor for buckling
        gamma_fatigue: 1.755  # Safety factor for fatigue failure (def: 1.0)
        buckling_method: dnvgl # Buckling code type [eurocode or dnvgl] (def: dnvgl)
        buckling_length: 15    # Buckling parameter
        frame3dd:
            shear: True
            geom: True
            tol: 1e-9
    FloatingSE:
        flag: True
        symmetric_moorings: True
        gamma_f: 1.35    # Safety factor for fatigue loads
        gamma_m: 1.3     # Safety factor for material properties
        gamma_n: 1.0     # Safety factor for ...
        gamma_b: 1.1     # Safety factor for ...
        gamma_fatigue: 1.755  # Safety factor for fatigue loads
    BOS:
        flag: False
    OpEx:
        flag: False
    LCOE:
        flag: False

    Loading:
        mass: 883219.1694411677
        center_of_mass: [-6.717886796932881, -0.14300017976275708, 3.9077860696396596]
        moment_of_inertia: [360309222.227464, 275803400.30740815, 262649300.6624307, 626.0694882989046, 12636406.17174711, 226494.8553912695]
        loads:
           -  force: [4787210.007396288, 1369703.5004503343, 1952914.9030555636]
              moment: [15556967.428202141, 142926217.21762758, 5999166.768431177]
              velocity: 11.0

Environment:
    air_density: 1.225
    air_dyn_viscosity: 1.81e-5
    weib_shape_parameter: 2.
    air_speed_sound: 340.
    shear_exp: 0.12
    water_density: 1025.0
    water_dyn_viscosity: 1.3351e-3
    soil_shear_modulus: 140.e+6
    soil_poisson: 0.4
    water_depth: 200.0
    significant_wave_height: 4.52
    significant_wave_period: 9.45

