# Generic analysis options where nothing is run
general:
    folder_output: outputs
    fname_output: optim

design_variables:
    tower:                          # TODO
        outer_diameter:
            flag: True
            lower_bound: 6.5
            upper_bound: 10.0
        layer_thickness:            # ---- keep these fixed (15,100)mm
            flag: True
            lower_bound: 4e-3  # def. 4e-3 ; 15e-3
            upper_bound: 2e-1   # def. 2e-1 ; 1e-1
        E:
            flag: True
            upper_bound: 250.e9

constraints:
    tower:
        height_constraint:
            flag: False # TODO
            lower_bound: 1.e-2
            upper_bound: 1.e-2
        stress:
            flag: True
        global_buckling:
            flag: True
        shell_buckling:
            flag: True
        d_to_t: # slenderness ratio controls the global buckling (critical)
            flag: True #False
            lower_bound: 80.0 # def. 80.0 ; 120.0
            upper_bound: 1000.0 # def. 500.0 ; 1000.0
        taper:
            flag: True # TODO 1
            lower_bound: 0.2 # def. 0.2 ; 
        slope:
            flag: True # TODO 1
        thickness_slope:
            flag: True # TODO 1
        frequency:
            flag: False # always for just tower
        frequency_1:
            flag: False #True TODO 2
            # stiff-stiff (cf. semi-sub report) TODO for M4W
            lower_bound: 0.45
            # soft-stiff (cf. semi-sub report) TODO for M4W
            # lower_bound: 0.15
            # upper_bound: 0.2

merit_figure: tower_mass # structural_mass #(tower+monpoile) # TODO

driver:
    optimization:
        flag: True
        max_iter: 40         # Maximum number of iterations (SLSQP)
        tol: 1e-2           # Convergence tolerance (SLSQP)
        solver: SLSQP       # Optimization solver. Other options are 'SLSQP' - 'CONMIN'
        step_size: 1.e-6    # Step size for finite differencing (def.: 1.e-3)
        form: forward       # Finite differencing mode, forward or central (def.)
        debug_print: True