                values: [0.5, 0.5]
        internal_structure_2d_fem:
            outfitting_factor: 1.07
            reference_axis: *id004
            layers:
               -  name: monopile_wall
                  material: steel
                  thickness:
                      grid: [0.0, 0.50000000000000000, 0.55555555555555558, 0.61111111111111116, 0.66666666666666663, 0.72222222222222221, 0.77777777777777779, 0.83333333333333337, 0.88888888888888884, 0.94444444444444442, 1.00000000000000000]
