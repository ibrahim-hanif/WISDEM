name: IEA 15MW Reference Turbine, tower & monopile only #(v) cf. `nrel5mw_tower.yaml`

assembly: #(v) 9 entries to describe the WT config and its components
    turbine_class: I
    turbulence_class: C
    drivetrain: geared
    rotor_orientation: Upwind
    number_of_blades: 3
    hub_height: 150.0
    rotor_diameter: 240.0 # def: 241.35064632 & iea15: 240.0
    rated_power: 15.e+6
    lifetime: 25.0

