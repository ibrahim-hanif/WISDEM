# Generic modeling options file to run standard WISDEM case
# NOTE: adapted from `modeling_options_1ea15_monopile_only_wisdemV3.yaml`
# - `Loading` changed to final converged M4W DT and nacelle data
General:
    verbosity: False  # When set to True, the code prints to screen many infos
WISDEM:
    RotorSE:
        flag: False
        spar_cap_ss: Spar_Cap_SS # Name in the yaml of the spar cap laminate on the suction side
        spar_cap_ps: Spar_Cap_PS # Name in the yaml of the spar cap laminate on the pressure side
        te_ss: TE_reinforcement_SS # Name in the yaml of the trailing edge reinforcement on the suction side
        te_ps: TE_reinforcement_PS # Name in the yaml of the trailing edge reinforcement on the pressure side
    DriveSE:
        flag: False
    TowerSE:             # Options of TowerSE module
        flag: True
        wind: PowerWind
        gamma_f: 1.2    # Safety factor for loads
        gamma_m: 1.3     # Safety factor for material properties
        gamma_n: 1.0     # Safety factor for consequence of failure
        gamma_b: 1.1     # Safety factor for buckling
        # gamma_fatigue: 1.755  # Safety factor for fatigue failure (def: 1.0)
        # buckling_method: dnvgl # Buckling code type [eurocode or dnvgl] (def: dnvgl)
        buckling_length: 15    # Buckling parameter
        frame3dd:
            shear: True
            geom: True
            tol: 1e-9
    FixedBottomSE:             # Options of FixedBottomSE module
        flag: True # TODO
        wind: PowerWind  # Wind used
        gamma_f: 1.2    # Safety factor for fatigue loads
        gamma_m: 1.3     # Safety factor for material properties
        gamma_n: 1.0     # Safety factor for ...
        gamma_b: 1.1     # Safety factor for ...
        # gamma_fatigue: 1.755  # Safety factor for fatigue loads (def: 1.0)
        buckling_method: dnvgl # Buckling code type [eurocode or dnvgl]
        buckling_length: 15    # Buckling parameter
        soil_springs: True
        gravity_foundation: False
        frame3dd:
            shear: True
            geom: True
            tol: 1e-7 #1e-9
    BOS:
        flag: False
    LCOE:
        flag: False

    Loading:
        mass: 928371.3339926121 # rna_
        center_of_mass: [-6.463160381536455, -0.13604523898516355, 3.900084902950369]
        moment_of_inertia: [361362650.36400914, 278437448.93026936, 264627673.71101972, 523.5272381991963, 12973950.906477753, 226599.30318679396]
        loads: # base_
            - force: [4787211.57879512, 1369723.6804996238, 1249545.7436713353]
              moment: [15549539.84883273, 142570081.80640805, 7673582.192106368]
              velocity: 11.0 # def.: 11.73732; cf. plot ms_loads_stats

